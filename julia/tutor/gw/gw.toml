# Parameters of tutor/gw/gw.jl (quick parameters)
#
# [model]
#   Nk       : number of k points (full Brillouin zone)
#   HoppingT : hopping t_h, ε_k = -2 t_h cos(k - A)
#   HubbardU : local interaction U
#   V        : nearest neighbour interaction, V_q = U + 2 V cos(q)
#   MuChem   : chemical potential
#   beta     : inverse temperature
#
# [contour]
#   Nt   : number of real time steps (NESSi Nt), the KB contour has
#          Nt + 1 time points; Nt ≥ SolveOrder
#   Ntau : number of imaginary time POINTS (KB convention, NESSi Ntau + 1)
#   h    : time step
#
# [solver]
#   SolveOrder        : order of the integration, 1 ⋯ 5 (NESSi uses 5)
#   MatsMaxIter       : maximal number of Matsubara iterations
#   MatsMaxErr        : convergence threshold of the Matsubara iterations
#   BootstrapMaxIter  : maximal number of bootstrapping iterations
#   BootstrapMaxErr   : convergence threshold of the bootstrapping
#   TimeMaxErr        : convergence threshold of the corrector iterations
#   CorrectorSteps    : maximal number of corrector iterations per step
#   parallel_axis     : "serial", "k" (threads over k points), or "kernel"
#                       (threaded Dyson kernels)
#   current_mode      : "nessi" (default, velocity 2 t_h sin(k)) or
#                       "peierls_corrected" (additional column with the
#                       velocity 2 t_h sin(k - A))
#
# [pulse]
#   E(t) = E0 exp(-((t - t0)/width)^2) sin(omega (t - t0))
#
# [output]
#   dir, prefix : output directory and file prefix

[model]
Nk = 8
HoppingT = 1.0
HubbardU = 1.0
V = 0.25
MuChem = 0.0
beta = 5.0

[contour]
Nt = 8
Ntau = 41
h = 0.02

[solver]
SolveOrder = 5
MatsMaxIter = 60
MatsMaxErr = 1e-9
BootstrapMaxIter = 40
BootstrapMaxErr = 1e-10
TimeMaxErr = 1e-10
CorrectorSteps = 6
parallel_axis = "serial"
current_mode = "nessi"

[pulse]
E0 = 1.0
omega = 2.0
t0 = 0.05
width = 0.1

[output]
dir = "."
prefix = "gw"
