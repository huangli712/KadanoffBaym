# Parameters of tutor/hubbard_bethe/hubbard_bethe_ness2_trunc.jl (quick)
#
# The sections [grid], [model], [solver], and [output] are those of
# tutor/hubbard_bethe/hubbard_bethe_ness2.toml (steady state). The section [trunc]
# controls the truncated propagation:
#
#   tc             : cut-off of the moving window, tc ≥ 2 SolveOrder + 2
#   tmax           : number of propagated steps (relative to the NESS)
#   downsampling   : the contour time step is h * downsampling
#   SolveOrder     : order of the integration, 1 ⋯ 5
#   CorrectorSteps : number of corrector steps per time step

[grid]
Nft = 512
h = 0.02

[model]
beta = 10.0
U = 2.0
mu = 0.0

[solver]
Niter = 100
errmax = 1e-6
mixing = 0.6
ipt_flag = 1
out_every = 0

[trunc]
tc = 20
tmax = 10
downsampling = 2
SolveOrder = 5
CorrectorSteps = 3

[output]
dir = "."
prefix = "bethe_ness2_trunc"
