# Parameters of tutor/trunc_bethe/trunc_bethe.jl (quick parameters)
#
# [contour]
#   nt   : number of real time steps of the full start (NESSi nt), the
#          full contour has nt + 1 time points, nt ≥ tc
#   ntau : number of imaginary time POINTS (KB convention, NESSi ntau + 1)
#   h    : time step
#   beta : inverse temperature
#   tc   : cut-off of the moving window, tc ≥ 2 SolveOrder + 2
#   tmax : last NESSi time step of the propagation (KB time step tmax + 1)
#
# [model]
#   U    : interaction after the quench (U = 0 on the Matsubara branch)
#   epsk : energies of the lattice Green's functions G_k
#
# [solver]
#   SolveOrder       : order of the integration, 1 ⋯ 5
#   BootstrapMaxIter : maximal number of bootstrapping iterations
#   BootstrapMaxErr  : convergence threshold (checked after iteration 4)
#   CorrectorSteps   : number of corrector steps per time step
#
# [output]
#   dir, prefix : output directory and file prefix

[contour]
nt = 15
ntau = 101
h = 0.02
beta = 5.0
tc = 15
tmax = 40

[model]
U = 1.0
epsk = [-1.0, 0.0, 1.0]

[solver]
SolveOrder = 5
BootstrapMaxIter = 40
BootstrapMaxErr = 1e-10
CorrectorSteps = 3

[output]
dir = "."
prefix = "trunc_bethe"
