# Parameters of tutor/holstein_bethe/holstein_bethe_umig.jl
#
# [model] (NESSi demo_Holstein.py)
#   Hopping    : hopping of the Bethe lattice
#   El_Ph_g    : electron-phonon coupling
#   Phfreq_w0  : phonon frequency
#   MuChem_MF  : chemical potential including the mean-field shift
#
# [drive.*] nt + 2 values (NESSi tstp = -1, ⋯, nt): dHopping is the
# sin² pulse of demo_Holstein.py (amplitude 1, end 0.6), dEl_Ph_g = 0.
# [profile.release] holds the parameters of demo_Holstein.py.

[contour]
nt = 8
ntau = 40
h = 0.03
beta = 10.0
solve_order = 3

[solver]
mats_max_iter = 100
mats_max_error = 1e-7
bootstrap_max_iter = 50
bootstrap_max_error = 1e-7
corrector_steps = 3

[model]
Hopping = 1.0
El_Ph_g = 0.5
Phfreq_w0 = 1.0
MuChem_MF = 0.5

[drive.dHopping]
mode = "sin2"
amplitude = 1.0
end = 0.6

[drive.dEl_Ph_g]
mode = "constant"
value = 0.0

[output]
dir = "."
prefix = "holstein_bethe_umig"

[profile.quick]

[profile.release]
contour = { nt = 400, ntau = 500, solve_order = 5 }
solver = { mats_max_iter = 800, bootstrap_max_iter = 20, corrector_steps = 5 }

[profile.release.drive.dHopping]
mode = "sin2"
amplitude = 1.0
end = 0.6
