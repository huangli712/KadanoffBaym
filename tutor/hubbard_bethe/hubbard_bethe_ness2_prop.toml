# Parameters of tutor/hubbard_bethe/hubbard_bethe_ness2_prop.jl
#
# Real-time propagation of the DMFT equations of the Hubbard model on the
# Bethe lattice (bandwidth 4) in equilibrium, second order perturbation
# theory as the impurity solver.
#
# [contour]
#   nt   : number of the real time steps (as in NESSi), the KB contour
#          has nt + 1 time points
#   ntau : number of the imaginary time POINTS (KB convention), it is the
#          NESSi input value plus 1; ≥ 2
#   h    : time step, > 0
#   beta : inverse temperature, > 0
#
# [model]
#   U    : local interaction
#   mu   : chemical potential
#
# [solver]
#   SolveOrder       : order of the integration, 1 ⋯ 5, nt ≥ SolveOrder
#   ipt_flag         : 1 for IPT (Weiss field), 0 for self-consistent PT
#   mat_method       : Matsubara Dyson solver, "fixpoint" (as in NESSi)
#                      or "fourier"
#   BootstrapMaxIter : maximal number of the Matsubara and bootstrapping
#                      iterations
#   BootstrapMaxErr  : convergence threshold (checked after iteration 4)
#   CorrectorSteps   : number of the corrector steps per time step
#
# [output]
#   dir    : output directory (created if necessary)
#   prefix : prefix of the output files

[contour]
nt = 40
ntau = 201
h = 0.02
beta = 10.0

[model]
U = 2.0
mu = 0.0

[solver]
SolveOrder = 5
ipt_flag = 1
mat_method = "fixpoint"
BootstrapMaxIter = 100
BootstrapMaxErr = 1e-8
CorrectorSteps = 4

[output]
dir = "."
prefix = "bethe_ness2_prop"
