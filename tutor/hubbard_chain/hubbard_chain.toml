# Parameters of tutor/hubbard_chain/hubbard_chain_{2b,gw,tpp}.jl
#
# [contour]
#   nt          : number of real time steps (NESSi Nt), KB ntime = nt + 1
#   ntau        : number of imaginary time intervals (NESSi Ntau)
#   h, beta     : time step and inverse temperature
#   solve_order : order of the integration, 1 ⋯ 5
#
# [model]
#   Nsites   : number of sites of the open chain
#   HoppingT : nearest neighbour hopping
#   HubbardU : on-site interaction
#   MuChem   : chemical potential (shifted by U n / Nsites)
#   RampSite : site of the on-site quench (1-based)
#   RampW0   : on-site energy after the quench
#
# [profile.release] holds the parameters of NESSi demo_hubbard_chain.py on
# the time grid of hubbardchain_exact_n2_U1_w5.dat (h = 0.05).

[contour]
nt = 10
ntau = 40
h = 0.05
beta = 20.0
solve_order = 3

[solver]
mats_max_iter = 100
mats_max_error = 1e-8
bootstrap_max_iter = 50
bootstrap_max_error = 1e-10
corrector_steps = 3

[model]
Nsites = 2
HoppingT = 1.0
HubbardU = 1.0
MuChem = 0.0
RampSite = 1
RampW0 = 5.0

[output]
dir = "."
prefix = "hubbardchain"

[profile.quick]
contour = { nt = 10, ntau = 40, solve_order = 3 }
solver = { mats_max_iter = 100, bootstrap_max_iter = 50, corrector_steps = 3 }

[profile.release]
contour = { nt = 399, ntau = 400, solve_order = 5 }
solver = { mats_max_iter = 100, bootstrap_max_iter = 50, corrector_steps = 3 }
