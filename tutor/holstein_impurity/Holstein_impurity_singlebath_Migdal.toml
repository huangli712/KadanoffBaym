# Parameters of tutor/holstein_impurity/Holstein_impurity_singlebath_Migdal.jl
#
# [model] (NESSi demo_Holstein_impurity.py)
#   Hopping   : hopping between the impurity and the bath site
#   El_Ph_g   : electron-phonon coupling
#   Phfreq_w0 : phonon frequency
#   Eps0_MF   : impurity level including the mean-field shift
#   Eps1      : level of the bath site
#
# [drive.*] nt + 2 values (NESSi tstp = -1, ⋯, nt): sin² pulses of
# demo_Holstein_impurity.py (end 0.6), dHopping amplitude 0.5,
# dEl_Ph_g amplitude 0.4. [profile.release] holds the demo parameters.

[contour]
nt = 8
ntau = 40
h = 0.04
beta = 2.0
solve_order = 3

[solver]
mats_max_iter = 100
mats_max_error = 1e-7
bootstrap_max_iter = 50
bootstrap_max_error = 1e-7
corrector_steps = 3

[model]
Hopping = 1.0
El_Ph_g = 0.5
Phfreq_w0 = 1.0
Eps0_MF = 0.5
Eps1 = -0.5

[drive.dHopping]
mode = "sin2"
amplitude = 0.5
end = 0.6

[drive.dEl_Ph_g]
mode = "sin2"
amplitude = 0.4
end = 0.6

[output]
dir = "."
prefix = "Holstein_impurity_singlebath_Migdal"

[profile.quick]

[profile.release]
contour = { nt = 500, ntau = 200, solve_order = 5 }
solver = { mats_max_iter = 800, bootstrap_max_iter = 20, corrector_steps = 5 }

[profile.release.drive.dHopping]
mode = "sin2"
amplitude = 0.5
end = 0.6

[profile.release.drive.dEl_Ph_g]
mode = "sin2"
amplitude = 0.4
end = 0.6
