# Parameters of examples/falicov_kimball/falicov_kimball.toml
#
# [contour]
#   nt          : number of real time steps; KB ntime = nt + 1
#   ntau        : number of imaginary time intervals
#   h, beta     : time step and inverse temperature
#   solve_order : order of the integration, 1 ⋯ 5
#
# [model]
#   U0 : interaction on the Matsubara branch (t < 0)
#   U1 : interaction after the quench (t ≥ 0)
#
# [profile.release] holds the release-grid parameters.

[contour]
nt = 10
ntau = 50
h = 0.01
beta = 5.0
solve_order = 3

[solver]
mats_max_iter = 100
mats_max_error = 1e-7
bootstrap_max_iter = 100
bootstrap_max_error = 1e-7
corrector_steps = 3

[model]
U0 = 1.0
U1 = 2.0

[output]
dir = "."
prefix = "falicov_kimball"

[profile.quick]
contour = { nt = 10, ntau = 50, solve_order = 3 }

[profile.release]
contour = { nt = 50, ntau = 200, solve_order = 5 }
