# Parameters of examples/hubbard/bethe_steady_truncated.toml (quick)
#
# The steady state is computed by the same DMFT loop as bethe_steady.toml;
# the [trunc] section controls the truncated propagation:
#
#   tc             : cut-off of the moving window, tc ≥ 2 SolveOrder + 2
#   tmax           : number of propagated steps (relative to the NESS)
#   downsampling   : the contour time step is h * downsampling
#   SolveOrder     : order of the integration, 1 ⋯ 5
#   CorrectorSteps : number of corrector steps per time step
#
# The default parameters are the ones of the reference data
# data/tutor/steady_bethe_trunc.dat, which examples/validate compares against.

[grid]
Nft = 256
h = 0.02

[model]
beta = 10.0
U = 2.0
mu = 0.0

[solver]
Niter = 20
errmax = 1e-6
mixing = 0.6
ipt_flag = 1
out_every = 0

[trunc]
tc = 20
tmax = 4
downsampling = 2
SolveOrder = 5
CorrectorSteps = 3

[output]
dir = "."
prefix = "bethe_steady_truncated"
