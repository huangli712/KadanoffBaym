# Parameters of examples/hubbard/bethe_steady_propagation.toml
#
# Real-time propagation of the DMFT equations of the Hubbard model on the
# Bethe lattice (bandwidth 4) in equilibrium, second order perturbation
# theory as the impurity solver.
#
# [contour]
#   nt   : number of real time steps; the KB contour has nt + 1 time points
#   ntau : number of imaginary time points (the library uses ntau - 1
#          intervals, at least 2)
#   h    : time step, > 0
#   beta : inverse temperature, > 0
#
# [model]
#   U    : local interaction
#   mu   : chemical potential
#
# [solver]
#   SolveOrder       : order of the integration, 1 ⋯ 5, nt ≥ SolveOrder
#   ipt_flag         : 1 for IPT (Weiss field), 0 for self-consistent PT
#   mat_method       : Matsubara Dyson solver, "fixpoint" or "fourier"
#   BootstrapMaxIter : maximal number of the Matsubara and bootstrapping
#                      iterations
#   BootstrapMaxErr  : convergence threshold (checked after iteration 4)
#   CorrectorSteps   : number of the corrector steps per time step
#
# [output]
#   dir    : output directory (created if necessary)
#   prefix : prefix of the output files
#
# The default parameters are the ones of the reference data
# data/tutor/examples_bethe_prop.dat, which examples/validate compares against.

[contour]
nt = 8
ntau = 41
h = 0.05
beta = 5.0

[model]
U = 1.5
mu = 0.0

[solver]
SolveOrder = 3
ipt_flag = 1
mat_method = "fixpoint"
BootstrapMaxIter = 20
BootstrapMaxErr = 1e-8
CorrectorSteps = 2

[output]
dir = "."
prefix = "bethe_steady_propagation"
